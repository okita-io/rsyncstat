[package]
name = "rsyncstat-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "RSyncStat desktop application"
default-run = "rsyncstat"

build = "build.rs"

[[bin]]
name = "rsyncstat"
path = "src/main.rs"

[dependencies]
rsyncstat-model = { path = "../rsyncstat-model" }
rsyncstat-filter = { path = "../rsyncstat-filter" }
rsyncstat-scan = { path = "../rsyncstat-scan" }
rsyncstat-plan = { path = "../rsyncstat-plan" }
rsyncstat-exec = { path = "../rsyncstat-exec" }
rsyncstat-treemap = { path = "../rsyncstat-treemap" }
eframe.workspace = true
rfd.workspace = true
crossbeam-channel.workspace = true
trash.workspace = true
egui_ltreeview = "0.10.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "=0.1.34"

# `cargo install cargo-bundle`, then run from the repo root:
# `cargo bundle --release -p rsyncstat-app` (icon paths are relative to the root)
# builds target/release/bundle/osx/RSyncStat.app (and a .deb on Linux).
[package.metadata.bundle]
name = "RSyncStat"
identifier = "io.okita.rsyncstat"
icon = ["crates/rsyncstat-app/assets/icon.icns", "crates/rsyncstat-app/assets/icon.png"]
short_description = "Disk-usage treemap and safe folder sync"
category = "public.app-category.utilities"
