[package]
name = "rsyncstat-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "RSyncStat desktop application"
default-run = "rsyncstat"

[[bin]]
name = "rsyncstat"
path = "src/main.rs"

[dependencies]
rsyncstat-model = { path = "../rsyncstat-model" }
rsyncstat-filter = { path = "../rsyncstat-filter" }
rsyncstat-scan = { path = "../rsyncstat-scan" }
rsyncstat-plan = { path = "../rsyncstat-plan" }
rsyncstat-exec = { path = "../rsyncstat-exec" }
rsyncstat-treemap = { path = "../rsyncstat-treemap" }
eframe.workspace = true
rfd.workspace = true
crossbeam-channel.workspace = true
trash.workspace = true
egui_ltreeview = "0.10.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows.workspace = true
