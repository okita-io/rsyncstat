name: Release

# Builds downloadable apps when a version tag such as v0.1.0 is pushed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-latest
          - name: linux
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked -p rsyncstat-app

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          cargo install cargo-bundle --locked
          cargo bundle --release -p rsyncstat-app
          ditto -c -k --keepParent target/release/bundle/osx/RSyncStat.app RSyncStat-macos.zip

      - name: Package Windows exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/rsyncstat.exe -DestinationPath RSyncStat-windows.zip

      - name: Package Linux binary
        if: runner.os == 'Linux'
        run: tar -czf RSyncStat-linux.tar.gz -C target/release rsyncstat

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            RSyncStat-macos.zip
            RSyncStat-windows.zip
            RSyncStat-linux.tar.gz
          fail_on_unmatched_files: false
